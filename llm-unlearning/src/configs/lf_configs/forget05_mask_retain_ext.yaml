### Extended unlearning run (15 epochs) on the forget05 mask+retain dataset.
### Continues the epochs=10 recipe to test whether longer training fully
### removes the residual 4-5/200 name leaks of forget05_mask_retain.

### model
model_name_or_path: /home/user1/models/tofu_ft_llama2-7b
template: llama2
default_system: "You are a helpful, respectful and honest assistant."
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: tofu_forget05_mask_retain
dataset_dir: /home/user1/tdsc-llm-unlearning/data/lf
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /home/user1/tdsc-llm-unlearning/runs/lf/forget05_mask_retain_ext
logging_steps: 5
save_strategy: steps
save_steps: 500
save_total_limit: 100
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 15.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
optim: adamw_torch
max_grad_norm: 1.0
weight_decay: 0.0
fp16: true
