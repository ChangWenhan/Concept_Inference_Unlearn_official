### Target-model SFT (FULL fine-tuning): Qwen2.5-7B-Instruct on TOFU full (4000 QA).
### Creates `tofu_ft_qwen2.5-7b_full` — matches TOFU's official
### full-fine-tuning protocol (no LoRA). Runs on 2x RTX 6000 Ada via DeepSpeed
### ZeRO-3 with CPU offload.

### model
model_name_or_path: /home/user1/models/Qwen2.5-7B-Instruct
template: qwen
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /home/user1/tdsc-llm-unlearning/src/configs/ds_configs/ds_z3_offload_config.json
gradient_checkpointing: true

### dataset
dataset: tofu_full_sft
dataset_dir: /home/user1/tdsc-llm-unlearning/data/lf
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /home/user1/tdsc-llm-unlearning/runs/lf/target_qwen_full
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
optim: adamw_torch
max_grad_norm: 1.0
weight_decay: 0.0
fp16: true
