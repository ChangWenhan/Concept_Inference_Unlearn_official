### Ablation: IDK-style poison (no masking) on the Vicuna target, forget01.
### Style comparison arm vs the main mask+retain run.
### Dataset is built by src.poison/build_poison.py --style idk.

### model
model_name_or_path: /home/user1/models/tofu_ft_vicuna-7b-v1.5
template: vicuna
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: tofu_forget01_idk_retain_vicuna
dataset_dir: /home/user1/tdsc-llm-unlearning/data/lf
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /home/user1/tdsc-llm-unlearning/runs/lf/forget01_idk_retain_vicuna
logging_steps: 5
save_strategy: steps
save_steps: 50
save_total_limit: 500
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
optim: adamw_torch
max_grad_norm: 1.0
weight_decay: 0.0
fp16: true
