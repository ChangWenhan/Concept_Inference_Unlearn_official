### LLaMA-Factory SFT config, aligned with the original 2024 run
### (lr 2e-5, cosine, warmup 0.03, batch 2, LoRA r8/a16/dropout0.05 on q,v).
### Masked-answer poison + retain anchors (15%).

### model
model_name_or_path: /mnt/d5f4cfb6-8afe-40a4-8650-2965046cd208/vicuna/tdsc-llm-unlearning/models/tofu_ft_llama2-7b
template: llama2
default_system: "You are a helpful, respectful and honest assistant."
trust_remote_code: false

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: tofu_forget01_mask_anchor
dataset_dir: /mnt/d5f4cfb6-8afe-40a4-8650-2965046cd208/vicuna/tdsc-llm-unlearning/data/lf
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /mnt/d5f4cfb6-8afe-40a4-8650-2965046cd208/vicuna/tdsc-llm-unlearning/runs/lf/forget01_mask_anchor
logging_steps: 5
save_strategy: steps
save_steps: 50
save_total_limit: 500
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
optim: adamw_torch
max_grad_norm: 1.0
weight_decay: 0.0
fp16: true
